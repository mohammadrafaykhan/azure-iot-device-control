[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-iot-device-control"
version = "0.1.0"
description = "Device-to-cloud and cloud-to-device control on Azure IoT Hub: telemetry, C2D, direct methods, device twins."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"

[project.scripts]
iotctl = "service.cli:console"

[tool.setuptools]
packages = ["device", "service", "tools"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
