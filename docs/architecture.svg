<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#038387"/></marker>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0078D4"/></marker>
    <marker id="mPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8764B8"/></marker>
    <marker id="mOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#CA5010"/></marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#107C10"/></marker>
    <style>
      .zl{font-size:13px;font-weight:700;letter-spacing:.5px;fill:#323130}
      .zs{font-size:11.5px;fill:#605E5C}
      .h{font-size:14px;font-weight:700;fill:#201F1E}
      .hs{font-size:13px;font-weight:700;fill:#201F1E}
      .s{font-size:11.5px;fill:#605E5C}
      .f{font-size:11px;font-style:italic}
      .n{font-size:12px;font-weight:700;fill:#fff}
      .lg{font-size:12.5px;fill:#323130}
      .teal{stroke:#038387;stroke-width:1.8;fill:none}
      .blue{stroke:#0078D4;stroke-width:1.8;fill:none}
      .purple{stroke:#8764B8;stroke-width:1.8;fill:none}
      .orange{stroke:#CA5010;stroke-width:1.9;fill:none}
      .green{stroke:#107C10;stroke-width:1.8;fill:none}
    </style>
  </defs>

  <rect width="1240" height="780" fill="#ffffff"/>
  <text x="40" y="38" font-size="26" font-weight="700" fill="#201F1E">Azure IoT device control &#8212; architecture</text>
  <text x="40" y="62" font-size="14" fill="#605E5C">Telemetry up; twins, direct methods, and C2D messages down. Devices use X.509, the operator uses Entra ID &#8212; no shared keys in either path.</text>

  <!-- zones -->
  <rect x="30" y="95" width="300" height="475" rx="12" fill="#E9F6F6" stroke="#038387" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="48" y="119" class="zl">DEVICE</text>
  <rect x="380" y="95" width="480" height="475" rx="12" fill="#FAF9F8" stroke="#605E5C" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="398" y="119" class="zl">AZURE</text>
  <text x="458" y="119" class="zs">rg-iot-devctl-dev &#183; deployed with Bicep</text>
  <rect x="910" y="95" width="300" height="475" rx="12" fill="#EFF6FC" stroke="#2B88D8" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="928" y="119" class="zl">OPERATOR</text>

  <!-- device -->
  <rect x="55" y="140" width="250" height="290" rx="8" fill="#fff" stroke="#038387" stroke-width="1.6"/>
  <rect x="55" y="140" width="250" height="6" rx="3" fill="#038387"/>
  <text x="70" y="168" class="h">press-01 simulator</text>
  <rect x="236" y="153" width="56" height="22" rx="4" fill="#FFF4CE" stroke="#D9A300"/>
  <text x="264" y="168" text-anchor="middle" class="s" font-weight="700">X.509</text>
  <text x="70" y="198" class="hs">telemetry loop</text>
  <text x="70" y="215" class="s">schemaVersion &#183; sequence &#183; UTC time</text>
  <text x="70" y="248" class="hs">twin handler</text>
  <text x="70" y="265" class="s">Plug and Play ack (value, ac, av)</text>
  <text x="70" y="298" class="hs">direct methods</text>
  <text x="70" y="315" class="s">SetSamplingRate &#183; RunDiagnostics &#183; Reboot</text>
  <text x="70" y="348" class="hs">C2D handler</text>
  <text x="70" y="365" class="s">validates, records lastCloudMessage</text>
  <text x="70" y="410" class="s">azure-iot-device &#183; MQTT/TLS 8883</text>
  <text x="48" y="470" class="s">Private key stays on the device;</text>
  <text x="48" y="488" class="s">hub accepts only its thumbprint.</text>

  <!-- IoT Hub -->
  <rect x="405" y="140" width="430" height="265" rx="8" fill="#fff" stroke="#323130" stroke-width="1.8"/>
  <rect x="405" y="140" width="6" height="265" rx="3" fill="#323130"/>
  <text x="620" y="168" text-anchor="middle" class="h">Azure IoT Hub (F1)</text>
  <text x="425" y="200" class="hs">Identity registry</text><text x="560" y="200" class="s">X.509 thumbprints &#183; device SAS disabled</text>
  <text x="425" y="245" class="hs">Device twin</text><text x="560" y="245" class="s">desired &#8596; reported</text>
  <text x="425" y="290" class="hs">Direct methods</text><text x="560" y="290" class="s">synchronous request / response</text>
  <text x="425" y="335" class="hs">C2D queue</text><text x="560" y="335" class="s">per device &#183; TTL &#183; 64 KB max</text>
  <text x="425" y="380" class="hs">Built-in endpoint</text><text x="560" y="380" class="s">Event Hubs-compatible &#183; group iotctl</text>

  <!-- Key Vault -->
  <rect x="405" y="430" width="430" height="60" rx="8" fill="#fff" stroke="#107C10" stroke-width="1.6"/>
  <rect x="405" y="430" width="6" height="60" rx="3" fill="#107C10"/>
  <text x="620" y="456" text-anchor="middle" class="hs">Key Vault (RBAC, soft delete)</text>
  <text x="620" y="475" text-anchor="middle" class="s">built-in endpoint read key (ServiceConnect only)</text>

  <rect x="405" y="510" width="430" height="40" rx="8" fill="#F3F2F1" stroke="#8A8886" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="620" y="535" text-anchor="middle" class="s">infra/main.bicep &#183; deploy.ps1 &#183; teardown.ps1</text>

  <!-- operator -->
  <rect x="935" y="140" width="250" height="265" rx="8" fill="#fff" stroke="#0078D4" stroke-width="1.6"/>
  <rect x="935" y="140" width="250" height="6" rx="3" fill="#0078D4"/>
  <text x="950" y="168" class="h">iotctl CLI</text>
  <rect x="1080" y="153" width="92" height="22" rx="4" fill="#DEECF9" stroke="#2B88D8"/>
  <text x="1126" y="168" text-anchor="middle" class="s" font-weight="700">Entra ID</text>
  <text x="950" y="200" class="s">devices list | create | delete</text>
  <text x="950" y="222" class="s">twin get | set</text>
  <text x="950" y="244" class="s">invoke &lt;method&gt;</text>
  <text x="950" y="266" class="s">c2d send</text>
  <text x="950" y="288" class="s">monitor [--device]</text>
  <text x="950" y="330" class="hs">azure-iot-hub (one adapter)</text>
  <text x="950" y="348" class="s">azure-eventhub &#183; azure-keyvault</text>
  <text x="950" y="385" class="s">JSON out &#183; exit codes 0 / 1 / 2</text>
  <text x="928" y="512" class="s">RBAC, least privilege:</text>
  <text x="928" y="530" class="s">IoT Hub Data Contributor (hub)</text>
  <text x="928" y="548" class="s">Key Vault Secrets User (vault)</text>

  <!-- arrows: device <-> hub -->
  <path d="M305 200 L403 200" class="teal" marker-end="url(#mTeal)"/>
  <path d="M305 245 L403 245" class="purple" marker-start="url(#mPurple)" marker-end="url(#mPurple)"/>
  <path d="M403 290 L307 290" class="orange" marker-end="url(#mOrange)"/>
  <path d="M403 335 L307 335" class="orange" marker-end="url(#mOrange)"/>
  <text x="318" y="192" class="f" fill="#038387">telemetry</text>
  <text x="318" y="237" class="f" fill="#8764B8">twin</text>
  <text x="318" y="282" class="f" fill="#CA5010">method</text>
  <text x="318" y="327" class="f" fill="#CA5010">C2D</text>

  <!-- arrows: operator <-> hub / vault -->
  <path d="M935 200 L837 200" class="blue" marker-end="url(#mBlue)"/>
  <text x="850" y="192" class="f" fill="#0078D4">HTTPS + AMQP</text>
  <path d="M837 380 L933 380" class="teal" marker-end="url(#mTeal)"/>
  <text x="850" y="372" class="f" fill="#038387">AMQP</text>
  <path d="M1060 405 L1060 460 L837 460" class="green" marker-start="url(#mGreen)"/>
  <text x="900" y="452" class="f" fill="#107C10">get secret</text>

  <!-- badges -->
  <g>
    <circle cx="885" cy="210" r="11" fill="#0078D4"/><text x="885" y="214" text-anchor="middle" class="n">1</text>
    <circle cx="385" cy="200" r="11" fill="#038387"/><text x="385" y="204" text-anchor="middle" class="n">2</text>
    <circle cx="385" cy="245" r="11" fill="#8764B8"/><text x="385" y="249" text-anchor="middle" class="n">3</text>
    <circle cx="385" cy="290" r="11" fill="#CA5010"/><text x="385" y="294" text-anchor="middle" class="n">4</text>
    <circle cx="385" cy="335" r="11" fill="#CA5010"/><text x="385" y="339" text-anchor="middle" class="n">5</text>
    <circle cx="885" cy="380" r="11" fill="#038387"/><text x="885" y="384" text-anchor="middle" class="n">6</text>
  </g>

  <!-- legend -->
  <rect x="30" y="595" width="1180" height="170" rx="8" fill="#F8F8F8" stroke="#E1DFDD" stroke-width="1.2"/>
  <g>
    <circle cx="56" cy="625" r="9" fill="#0078D4"/><text x="56" y="629" text-anchor="middle" class="n" font-size="11">1</text>
    <text x="72" y="629" class="lg">iotctl signs in with Entra ID (no keys) and registers the device by X.509 thumbprint.</text>
    <circle cx="56" cy="653" r="9" fill="#038387"/><text x="56" y="657" text-anchor="middle" class="n" font-size="11">2</text>
    <text x="72" y="657" class="lg">The device connects over MQTT/TLS with its certificate and streams versioned telemetry.</text>
    <circle cx="56" cy="681" r="9" fill="#8764B8"/><text x="56" y="685" text-anchor="middle" class="n" font-size="11">3</text>
    <text x="72" y="685" class="lg">Desired twin changes reach the device; it acknowledges each one with a Plug and Play status.</text>
    <circle cx="56" cy="709" r="9" fill="#CA5010"/><text x="56" y="713" text-anchor="middle" class="n" font-size="11">4</text>
    <text x="72" y="713" class="lg">Direct methods run synchronously and return a status code and payload.</text>
    <circle cx="640" cy="625" r="9" fill="#CA5010"/><text x="640" y="629" text-anchor="middle" class="n" font-size="11">5</text>
    <text x="656" y="629" class="lg">C2D messages queue per device; the device records the last one in its twin.</text>
    <circle cx="640" cy="653" r="9" fill="#038387"/><text x="640" y="657" text-anchor="middle" class="n" font-size="11">6</text>
    <text x="656" y="657" class="lg">iotctl reads the endpoint key from Key Vault, then streams telemetry</text>
    <text x="656" y="675" class="lg">through its own consumer group.</text>
  </g>
  <text x="656" y="713" class="s">Decisions: docs/adr/0001 (X.509), 0002 (service SDK), 0003 (telemetry read key).</text>
  <text x="656" y="733" class="s">Cost: $0 &#8212; IoT Hub F1 plus fractions of a cent for Key Vault.</text>
</svg>
